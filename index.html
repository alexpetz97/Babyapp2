<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex & Marcelina's Babyname</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #fff5f5 0%, #fed7aa 50%, #fbcfe8 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .card-shadow {
      box-shadow: 0 20px 40px -15px rgba(244, 63, 94, 0.15);
    }
    .btn-bounce:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-start pb-12">
  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="glass-card rounded-3xl p-4 shadow-sm mb-4 flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-pink-600 text-xl tracking-tight">Alex & Marcelina</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <p id="sync-status" class="text-[11px] font-semibold text-gray-500">Live-Sync aktiv</p>
        </div>
      </div>
      <div class="flex bg-rose-100/60 p-1 rounded-2xl border border-rose-200/50">
        <button id="btn-alex" onclick="setUser('Alex')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-md">Alex</button>
        <button id="btn-marcelina" onclick="setUser('Marcelina')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 text-gray-600 hover:text-gray-900">Marcelina</button>
      </div>
    </div>

    <!-- Nachname Vorschau -->
    <div class="glass-card rounded-2xl p-3.5 shadow-sm mb-4">
      <label class="text-[11px] uppercase tracking-wider text-rose-400 font-bold block mb-1">Euer Nachname (Vorschau)</label>
      <input type="text" id="lastname-input" value="Petz" oninput="updateLastName(this.value)" class="w-full bg-white/80 rounded-xl px-3.5 py-2 text-base font-bold text-gray-800 outline-none border border-rose-100 focus:border-rose-400 focus:ring-2 focus:ring-rose-200 transition-all" />
    </div>

    <!-- Navigation Tabs -->
    <div class="glass-nav rounded-2xl p-1.5 shadow-sm mb-5 flex gap-1">
      <button id="tab-swipe-btn" onclick="setTab('swipe')" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all bg-white text-rose-600 shadow-sm">Swipen</button>
      <button id="tab-matches-btn" onclick="setTab('matches')" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all text-gray-500 hover:text-gray-800">Matches (<span id="match-count">0</span>)</button>
      <button id="tab-likes-btn" onclick="setTab('likes')" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all text-gray-500 hover:text-gray-800">Likes (<span id="like-count">0</span>)</button>
    </div>

    <!-- View: Swipe -->
    <div id="view-swipe" class="flex-1 flex flex-col justify-center items-center">
      <div class="w-full glass-card rounded-[2.5rem] p-8 card-shadow text-center relative overflow-hidden border border-white/80">
        
        <div class="inline-block mb-6">
          <span id="gender-tag" class="px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase bg-sky-100 text-sky-600 border border-sky-200/50 shadow-sm">
            Junge
          </span>
        </div>

        <div class="my-2">
          <h2 id="name-display" class="text-4xl font-black text-gray-800 tracking-tight leading-none mb-2">Liam</h2>
          <p id="surname-display" class="text-2xl font-bold text-rose-500/90 tracking-normal">Petz</p>
        </div>

        <div class="mt-6 bg-white/60 rounded-2xl p-3 border border-rose-100/50">
          <p id="origin-display" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Irisch</p>
        </div>

        <div class="flex justify-center items-center gap-8 mt-8">
          <button onclick="handleSwipe('dislike')" class="btn-bounce w-16 h-16 rounded-full bg-white text-gray-400 text-2xl flex items-center justify-center shadow-lg border border-gray-100 hover:bg-gray-50 transition-all">
            ✕
          </button>
          <button onclick="handleSwipe('like')" class="btn-bounce w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white text-3xl flex items-center justify-center shadow-xl shadow-rose-500/30 hover:scale-105 transition-all">
            ♥
          </button>
        </div>
      </div>
    </div>

    <!-- View: Matches -->
    <div id="view-matches" class="hidden space-y-3">
      <h3 class="font-extrabold text-xs uppercase tracking-wider text-gray-500 px-1">Gemeinsame Favoriten ❤️</h3>
      <div id="matches-list" class="space-y-2.5"></div>
    </div>

    <!-- View: Likes -->
    <div id="view-likes" class="hidden space-y-3">
      <h3 id="likes-title" class="font-extrabold text-xs uppercase tracking-wider text-gray-500 px-1">Deine Likes (Alex)</h3>
      <div id="likes-list" class="space-y-2.5"></div>
    </div>

  </div>

  <!-- Match Popup Modal -->

    <div class="glass-card rounded-[2.5rem] p-8 text-center max-w-xs w-full shadow-2xl border-2 border-white animate-in zoom-in-95 duration-200">
      <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner">
        💖
      </div>
      <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-pink-600">MATCH!</h2>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mt-2">Ihr beide liebt den Namen:</p>
      <p id="match-name-text" class="text-2xl font-black text-gray-800 mt-1">Liam Petz</p>
      <button onclick="closeModal()" class="btn-bounce mt-6 w-full py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 text-white font-extrabold rounded-2xl shadow-lg shadow-rose-500/30">
        Wunderschön! ✨
      </button>
    </div>
  </div>

    let dislikes = { Alex: {}, Marcelina: {} };
    let activeTab = 'swipe';

    async function saveLikeToFirebase(user, name, isLiked) {
      if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
      try {
        let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
        let payload = {};
        payload[name] = true;
        let endpoint = isLiked ? `${cleanUrl}/baby_data/likes/${user}.json` : `${cleanUrl}/baby_data/dislikes/${user}.json`;
        
        await fetch(endpoint, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {}
    }

    async function updateLastNameFirebase(val) {
      if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
      try {
        let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
        await fetch(`${cleanUrl}/baby_data.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lastName: val })
        });
      } catch (e) {}
    }

    async function listenToFirebase() {
      if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
      try {
        let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
        const res = await fetch(`${cleanUrl}/baby_data.json`);
        const data = await res.json();
        if (data) {
          if (data.lastName && data.lastName !== lastName) {
            lastName = data.lastName;
          }
          if (data.likes) {
            let prevMatches = getMatches(likes.Alex, likes.Marcelina).length;
            likes = data.likes;
            let newMatches = getMatches(likes.Alex, likes.Marcelina).length;
            
            if (newMatches > prevMatches) {
              let matches = getMatches(likes.Alex, likes.Marcelina);
              let latestMatch = matches[matches.length - 1];
              if (latestMatch) {
                document.getElementById('match-name-text').innerText = `${latestMatch.name} ${lastName}`;
                document.getElementById('match-modal').classList.remove('hidden');
              }
            }
          }
          if (data.dislikes) dislikes = data.dislikes;
          render();
        }
      } catch (e) {}
    }

    setInterval(listenToFirebase, 2500);
    listenToFirebase();

    function getMatches(alexL = {}, marcL = {}) {
      let alexKeys = Object.keys(alexL || {});
      let marcKeys = Object.keys(marcL || {});
      let matchedNames = alexKeys.filter(n => marcKeys.includes(n));
      return NAMES.filter(n => matchedNames.includes(n.name));
    }

    function setUser(u) {
      currentUser = u;
      localStorage.setItem('baby_current_user', u);
      currentIndex = parseInt(localStorage.getItem(`baby_index_${currentUser}`)) || 0;
      render();
    }

    function updateLastName(val) {
      lastName = val || '';
      updateLastNameFirebase(lastName);
      render();
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('view-swipe').classList.toggle('hidden', tab !== 'swipe');
      document.getElementById('view-matches').classList.toggle('hidden', tab !== 'matches');
      document.getElementById('view-likes').classList.toggle('hidden', tab !== 'likes');
      
      document.getElementById('tab-swipe-btn').className = `flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all ${tab==='swipe'?'bg-white text-rose-600 shadow-sm':'text-gray-500 hover:text-gray-800'}`;
      document.getElementById('tab-matches-btn').className = `flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all ${tab==='matches'?'bg-white text-rose-600 shadow-sm':'text-gray-500 hover:text-gray-800'}`;
      document.getElementById('tab-likes-btn').className = `flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all ${tab==='likes'?'bg-white text-rose-600 shadow-sm':'text-gray-500 hover:text-gray-800'}`;
      render();
    }

    function handleSwipe(dir) {
      if (currentIndex >= NAMES.length) return;
      let curr = NAMES[currentIndex];
      
      if (!likes[currentUser]) likes[currentUser] = {};
      if (!dislikes[currentUser]) dislikes[currentUser] = {};

      if (dir === 'like') {
        likes[currentUser][curr.name] = true;
        saveLikeToFirebase(currentUser, curr.name, true);
        
        let other = currentUser === 'Alex' ? 'Marcelina' : 'Alex';
        if (likes[other] && likes[other][curr.name]) {
          document.getElementById('match-name-text').innerText = `${curr.name} ${lastName}`;
          document.getElementById('match-modal').classList.remove('hidden');
        }
      } else {
        dislikes[currentUser][curr.name] = true;
        saveLikeToFirebase(currentUser, curr.name, false);
      }
      
      currentIndex++;
      localStorage.setItem(`baby_index_${currentUser}`, currentIndex);
      render();
    }

    function closeModal() {
      document.getElementById('match-modal').classList.add('hidden');
    }

    function render() {
      if (currentIndex >= NAMES.length) {
        currentIndex = NAMES.length;
      }

      let alexLikes = likes.Alex || {};
      let marcelinaLikes = likes.Marcelina || {};
      let matches = getMatches(alexLikes, marcelinaLikes);
      let myLikesArr = Object.keys(likes[currentUser] || {});

      document.getElementById('match-count').innerText = matches.length;
      document.getElementById('like-count').innerText = myLikesArr.length;
      document.getElementById('lastname-input').value = lastName;

      document.getElementById('btn-alex').className = `px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${currentUser==='Alex'?'bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}`;
      document.getElementById('btn-marcelina').className = `px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${currentUser==='Marcelina'?'bg-gradient-to-r from-purple-500 to-indigo-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}`;

      if (currentIndex < NAMES.length) {
        let curr = NAMES[currentIndex];
        document.getElementById('name-display').innerText = curr.name;
        document.getElementById('surname-display').innerText = lastName;
        document.getElementById('origin-display').innerText = curr.origin;
        
        let tag = document.getElementById('gender-tag');
        if (curr.gender === 'boy') {
          tag.innerText = 'Junge';
          tag.className = 'px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase shadow-sm bg-sky-100 text-sky-600 border border-sky-200/50';

          tag.innerText = 'Mädchen';
          tag.className = 'px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase shadow-sm bg-pink-100 text-pink-600 border border-pink-200/50';
        } else {
          tag.innerText = 'Unisex';
          tag.className = 'px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase shadow-sm bg-purple-100 text-purple-600 border border-purple-200/50';
        }
      } else {
        document.getElementById('name-display').innerText = 'Alle durch!';
        document.getElementById('surname-display').innerText = '🎉';
        document.getElementById('origin-display').innerText = 'Keine Namen mehr übrig';
      }

      let mList = document.getElementById('matches-list');
      if (matches.length === 0) {
        mList.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-gray-400 text-xs font-semibold">Noch keine Matches. Swipt weiter!</div>`;
      } else {
        mList.innerHTML = matches.map(m => `
          <div class="glass-card p-4 rounded-2xl shadow-sm flex justify-between items-center border border-white">
            <div>
              <span class="font-bold text-gray-800 text-base">${m.name} ${lastName}</span>
              <p class="text-[10px] font-semibold text-rose-400 uppercase tracking-wider">${m.origin}</p>
            </div>
            <span class="text-2xl animate-bounce">💖</span>
          </div>
        `).join('');
      }

      document.getElementById('likes-title').innerText = `Deine Likes (${currentUser})`;
      let lList = document.getElementById('likes-list');
      if (myLikesArr.length === 0) {
        lList.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-gray-400 text-xs font-semibold">Du hast noch keine Namen geliked.</div>`;
      } else {
        lList.innerHTML = myLikesArr.map(n => `
          <div class="glass-card p-3.5 rounded-2xl shadow-sm flex justify-between items-center border border-white">
            <span class="font-bold text-gray-800">${n} ${lastName}</span>
            <span class="text-xs text-rose-500 font-extrabold bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100">♥ Geliked</span>
          </div>
        `).join('');
      }
    }

    render();
