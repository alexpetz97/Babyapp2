<html lang="de">

<title>Alex & Marcelina's Babyname</title>

background: rgba(255, 255, 255, 0.85);
backdrop-filter: blur(16px);

background: rgba(255, 255, 255, 0.65);

box-shadow: 0 20px 40px -15px rgba(244, 63, 94, 0.15);

transform: scale(0.92);

<body class="min-h-screen p-4 flex flex-col items-center justify-start pb-12">
<div class="w-full max-w-md">

<div class="glass-card rounded-3xl p-4 shadow-sm mb-4 flex justify-between items-center">
<div>

</div>
<div class="flex bg-rose-100/60 p-1 rounded-2xl border border-rose-200/50">

</div>

<div class="glass-nav rounded-2xl p-1.5 shadow-sm mb-5 flex gap-1">

<!-- View: Swipe -->
<div id="view-swipe" class="flex-1 flex flex-col justify-center items-center">
<div class="w-full glass-card rounded-[2.5rem] p-8 card-shadow text-center relative overflow-hidden border border-white/80">
<div class="inline-block mb-6">
<span id="gender-tag" class="px-4 py-1.5 rounded-full text-xs font-bold tracking-wide uppercase bg-pink-100 text-pink-600 border border-pink-200/50 shadow-sm">
Mädchen
</span>
</div>
<div class="my-2">
<h2 id="name-display" class="text-4xl font-black text-gray-800 tracking-tight leading-none mb-2">Liam</h2>

</div>
<div class="mt-6 bg-white/60 rounded-2xl p-3 border border-rose-100/50">
<p id="origin-display" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Irisch</p>
</div>
<div class="flex justify-center items-center gap-8 mt-8">
<button onclick="handleSwipe('dislike')" class="btn-bounce w-16 h-16 rounded-full bg-white text-gray-400 text-2xl flex items-center justify-center shadow-lg border border-gray-100 hover:bg-gray-50 transition-all">
✕
</button>
<button onclick="handleSwipe('like')" class="btn-bounce w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white text-3xl flex items-center justify-center shadow-xl shadow-rose-500/30 hover:scale-105 transition-all">
♥
</button>
</div>
</div>
</div>

let currentUser = localStorage.getItem('baby_current_user') || 'Alex';
let lastName = 'Petz';

let likes = { Alex: {}, Marcelina: {} };
let dislikes = { Alex: {}, Marcelina: {} };
let activeTab = 'swipe';
async function saveLikeToFirebase(user, name, isLiked) {
if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
try {
let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
let payload = {};
payload[name] = true;
let endpoint = isLiked ? ⁠${cleanUrl}/baby_data/likes/${user}.json⁠ : ⁠${cleanUrl}/baby_data/dislikes/${user}.json⁠;
await fetch(endpoint, {
method: 'PATCH',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});
} catch (e) {}
}
async function updateLastNameFirebase(val) {
if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
try {
let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
await fetch(⁠${cleanUrl}/baby_data.json⁠, {
method: 'PATCH',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ lastName: val })
});
} catch (e) {}
}
async function listenToFirebase() {
if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
try {
let cleanUrl = FIREBASE_URL.endsWith('/') ? FIREBASE_URL.slice(0, -1) : FIREBASE_URL;
const res = await fetch(⁠${cleanUrl}/baby_data.json⁠);
const data = await res.json();
if (data) {
if (data.lastName && data.lastName !== lastName) {
lastName = data.lastName;
}
if (data.likes) {
let prevMatches = getMatches(likes.Alex, likes.Marcelina).length;
likes = data.likes;
let newMatches = getMatches(likes.Alex, likes.Marcelina).length;
if (newMatches > prevMatches) {
let matches = getMatches(likes.Alex, likes.Marcelina);
let latestMatch = matches[matches.length - 1];
if (latestMatch) {
document.getElementById('match-name-text').innerText = ⁠${latestMatch.name} ${lastName}⁠;
document.getElementById('match-modal').classList.remove('hidden');
}
}
}
if (data.dislikes) dislikes = data.dislikes;
render();
}
} catch (e) {}
}
setInterval(listenToFirebase, 2500);
listenToFirebase();
function getMatches(alexL = {}, marcL = {}) {
let alexKeys = Object.keys(alexL || {});
let marcKeys = Object.keys(marcL || {});
let matchedNames = alexKeys.filter(n => marcKeys.includes(n));
return NAMES.filter(n => matchedNames.includes(n.name));
}
function setUser(u) {
currentUser = u;
localStorage.setItem('baby_current_user', u);
currentIndex = parseInt(localStorage.getItem(⁠baby_index_${currentUser}⁠)) || 0;
document.getElementById('btn-alex').className = ⁠px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${u==='Alex'?'bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}⁠;
document.getElementById('btn-marcelina').className = ⁠px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${u==='Marcelina'?'bg-gradient-to-r from-purple-500 to-indigo-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}⁠;
render();
}
function updateLastName(val) {
lastName = val || '';
updateLastNameFirebase(lastName);
render();
}
function setTab(tab) {
activeTab = tab;
document.getElementById('view-swipe').classList.toggle('hidden', tab !== 'swipe');
document.getElementById('view-matches').classList.toggle('hidden', tab !== 'matches');
document.getElementById('view-likes').classList.toggle('hidden', tab !== 'likes');

document.getElementById('tab-matches-btn').className = ⁠flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all ${tab==='matches'?'bg-white text-rose-600 shadow-sm':'text-gray-500 hover:text-gray-800'}⁠;
document.getElementById('tab-likes-btn').className = ⁠flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all ${tab==='likes'?'bg-white text-rose-600 shadow-sm':'text-gray-500 hover:text-gray-800'}⁠;
render();
}
function handleSwipe(dir) {
if (currentIndex >= NAMES.length) return;
let curr = NAMES[currentIndex];
if (!likes[currentUser]) likes[currentUser] = {};
if (!dislikes[currentUser]) dislikes[currentUser] = {};
if (dir === 'like') {
likes[currentUser][curr.name] = true;
saveLikeToFirebase(currentUser, curr.name, true);
let other = currentUser === 'Alex' ? 'Marcelina' : 'Alex';
if (likes[other] && likes[other][curr.name]) {
document.getElementById('match-name-text').innerText = ⁠${curr.name} ${lastName}⁠;
document.getElementById('match-modal').classList.remove('hidden');
}
} else {
dislikes[currentUser][curr.name] = true;
saveLikeToFirebase(currentUser, curr.name, false);
}
currentIndex++;
localStorage.setItem(⁠baby_index_${currentUser}⁠, currentIndex);
render();
}
function closeModal() {
document.getElementById('match-modal').classList.add('hidden');
}
function render() {
if (currentIndex >= NAMES.length) {
currentIndex = NAMES.length;
}
let alexLikes = likes.Alex || {};
let marcelinaLikes = likes.Marcelina || {};
let matches = getMatches(alexLikes, marcelinaLikes);
let myLikesArr = Object.keys(likes[currentUser] || {});
document.getElementById('match-count').innerText = matches.length;
document.getElementById('like-count').innerText = myLikesArr.length;
document.getElementById('lastname-input').value = lastName;
document.getElementById('btn-alex').className = ⁠px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${currentUser==='Alex'?'bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}⁠;
document.getElementById('btn-marcelina').className = ⁠px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200 ${currentUser==='Marcelina'?'bg-gradient-to-r from-purple-500 to-indigo-500 text-white shadow-md':'text-gray-600 hover:text-gray-900'}⁠;
if (currentIndex < NAMES.length) {

document.getElementById('surname-display').innerText = lastName;
document.getElementById('origin-display').innerText = curr.origin;

tag.innerText = curr.gender === 'boy' ? 'Junge' : 'Mädchen';

if (matches.length === 0) {

}
document.getElementById('likes-title').innerText = ⁠Deine Likes (${currentUser})⁠;
let lList = document.getElementById('likes-list');
if (myLikesArr.length === 0) {
lList.innerHTML = ⁠<div class="glass-card p-6 rounded-2xl text-center text-gray-400 text-xs font-semibold">Du hast noch keine Namen geliked.</div>⁠;
} else {
lList.innerHTML = myLikesArr.map(n => ⁠<div class="glass-card p-3.5 rounded-2xl shadow-sm flex justify-between items-center border border-white"> <span class="font-bold text-gray-800">${n} ${lastName}</span> <span class="text-xs text-rose-500 font-extrabold bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100">♥ Geliked</span> </div>⁠).join('');
}
}
render();
</script>
