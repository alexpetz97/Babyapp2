<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex & Marcelina's Babyname</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-rose-50 min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-rose-500 text-lg">Alex & Marcelina</h1>
        <p id="sync-status" class="text-[10px] text-green-500 font-bold">🟢 Live-Synchronisiert</p>
      </div>
      <div class="flex bg-rose-50 p-1 rounded-xl">
        <button id="btn-alex" onclick="setUser('Alex')" class="px-3 py-1 rounded-lg text-xs font-bold bg-rose-500 text-white">Alex</button>
        <button id="btn-marcelina" onclick="setUser('Marcelina')" class="px-3 py-1 rounded-lg text-xs font-bold text-gray-500">Marcelina</button>
      </div>
    </div>

    <!-- Nachname -->
    <div class="bg-white rounded-xl p-3 shadow-sm mb-4">
      <label class="text-xs text-gray-400 font-semibold block mb-1">Euer Nachname (Vorschau):</label>
      <input type="text" id="lastname-input" value="Müller" oninput="updateLastName(this.value)" class="w-full bg-rose-50 rounded-lg p-2 text-sm font-bold outline-none border border-rose-100" />
    </div>

    <!-- Tabs -->
    <div class="flex bg-white rounded-xl p-1 shadow-sm mb-4">
      <button id="tab-swipe-btn" onclick="setTab('swipe')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-rose-100 text-rose-600">Swipen</button>
      <button id="tab-matches-btn" onclick="setTab('matches')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400">Matches (<span id="match-count">0</span>)</button>
      <button id="tab-likes-btn" onclick="setTab('likes')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400">Likes (<span id="like-count">0</span>)</button>
    </div>

    <!-- View: Swipe -->
    <div id="view-swipe" class="flex-1 flex flex-col justify-center items-center">
      <div class="w-full bg-white rounded-3xl p-8 shadow-md text-center border border-rose-100">
        <span id="gender-tag" class="px-3 py-1 rounded-full text-xs font-bold mb-4 inline-block bg-pink-100 text-pink-600">Mädchen</span>
        <h2 id="name-display" class="text-4xl font-extrabold text-gray-800">Emma</h2>
        <p id="surname-display" class="text-2xl font-bold text-rose-400 mt-1">Müller</p>
        <p id="origin-display" class="text-xs text-gray-500 mt-4">Modern / Europäisch</p>
        <div class="flex justify-center gap-6 mt-8">
          <button onclick="handleSwipe('dislike')" class="w-16 h-16 rounded-full bg-gray-100 text-gray-400 text-2xl font-bold active:scale-95 transition">✕</button>
          <button onclick="handleSwipe('like')" class="w-16 h-16 rounded-full bg-rose-500 text-white text-2xl font-bold active:scale-95 transition">♥</button>
        </div>
      </div>
    </div>

    <!-- View: Matches -->
    <div id="view-matches" class="hidden space-y-2">
      <h3 class="font-bold text-sm text-gray-700 px-1">Gemeinsame Favoriten (Matches ❤️):</h3>
      <div id="matches-list" class="space-y-2"></div>
    </div>

    <!-- View: Likes -->
    <div id="view-likes" class="hidden space-y-2">
      <h3 id="likes-title" class="font-bold text-sm text-gray-700 px-1">Deine Likes (Alex):</h3>
      <div id="likes-list" class="space-y-2"></div>
    </div>
  </div>

  <!-- Match Popup -->
  <div id="match-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-rose-300">
      <div class="text-4xl mb-2">💖</div>
      <h2 class="text-2xl font-bold text-rose-500">MATCH!</h2>
      <p class="text-sm text-gray-600 mt-1">Ihr beide liebt den Namen:</p>
      <p id="match-name-text" class="text-xl font-black text-gray-800 mt-1">Emma Müller</p>
      <button onclick="closeModal()" class="mt-6 w-full py-3 bg-rose-500 text-white font-bold rounded-2xl shadow-lg">Super!</button>
    </div>
  </div>

  <script>
    // ⚠️ DEINE FIREBASE REALTIME DATABASE URL HIER EINFÜGEN:
    const FIREBASE_URL = "https://babynameapp-dd66f-default-rtdb.europe-west1.firebasedatabase.app/";

    const baseNames = [
      { name: 'Liam', gender: 'boy', origin: 'Irisch / Deutsch' },
      { name: 'Emma', gender: 'girl', origin: 'Germanisch' },
      { name: 'Noah', gender: 'boy', origin: 'Hebräisch' },
      { name: 'Mia', gender: 'girl', origin: 'Skandinavisch' },
      { name: 'Oliver', gender: 'boy', origin: 'Lateinisch' },
      { name: 'Olivia', gender: 'girl', origin: 'Lateinisch' },
      { name: 'Mateo', gender: 'boy', origin: 'Spanisch' },
      { name: 'Sophia', gender: 'girl', origin: 'Griechisch' },
      { name: 'Lucas', gender: 'boy', origin: 'Griechisch' },
      { name: 'Charlotte', gender: 'girl', origin: 'Französisch' },
      { name: 'Leo', gender: 'boy', origin: 'Lateinisch' },
      { name: 'Ella', gender: 'girl', origin: 'Deutsch' }
    ];

    const NAMES = [];
    const prefixes = ['Al', 'El', 'Mar', 'San', 'Car', 'Cor', 'Mel', 'Nor', 'Ben', 'Finn'];
    const suffixes = ['son', 'ley', 'ton', 'lyn', 'ell', 'ian', 'er', 'en', 'ia', 'a'];
    
    for(let i = 0; i < 5200; i++) {
      let b = baseNames[i % baseNames.length];
      let gName = i < baseNames.length ? b.name : prefixes[i % prefixes.length] + b.name.toLowerCase() + suffixes[i % suffixes.length];
      if(i >= baseNames.length) gName = gName.charAt(0).toUpperCase() + gName.slice(1);
      NAMES.push({
        name: gName,
        gender: i % 2 === 0 ? 'boy' : 'girl',
        origin: 'Modern / Europäisch'
      });
    }

    let currentUser = 'Alex';
    let lastName = 'Müller';
    let currentIndex = 0;
    let likes = { Alex: [], Marcelina: [] };
    let dislikes = { Alex: [], Marcelina: [] };
    let activeTab = 'swipe';

    // Firebase Sync Engine
    async function syncToFirebase() {
      if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
      try {
        await fetch(`${FIREBASE_URL}/baby_data.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lastName, likes, dislikes })
        });
      } catch (e) {
        console.error("Sync error:", e);
      }
    }

    async function listenToFirebase() {
      if (!FIREBASE_URL || FIREBASE_URL.includes("HIER_DEINE")) return;
      try {
        const res = await fetch(`${FIREBASE_URL}/baby_data.json`);
        const data = await res.json();
        if (data) {
          if (data.lastName) lastName = data.lastName;
          if (data.likes) likes = data.likes;
          if (data.dislikes) dislikes = data.dislikes;
          render();
        }
      } catch (e) {
        console.error("Pull error:", e);
      }
    }

    // Automatische Aktualisierung alle 3 Sekunden
    setInterval(listenToFirebase, 3000);
    listenToFirebase();

    function setUser(u) {
      currentUser = u;
      document.getElementById('btn-alex').className = `px-3 py-1 rounded-lg text-xs font-bold ${u==='Alex'?'bg-rose-500 text-white':'text-gray-500'}`;
      document.getElementById('btn-marcelina').className = `px-3 py-1 rounded-lg text-xs font-bold ${u==='Marcelina'?'bg-purple-500 text-white':'text-gray-500'}`;
      render();
    }

    function updateLastName(val) {
      lastName = val || '';
      syncToFirebase();
      render();
    }

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('view-swipe').classList.toggle('hidden', tab !== 'swipe');
      document.getElementById('view-matches').classList.toggle('hidden', tab !== 'matches');
      document.getElementById('view-likes').classList.toggle('hidden', tab !== 'likes');
      
      document.getElementById('tab-swipe-btn').className = `flex-1 py-2 text-xs font-bold rounded-lg ${tab==='swipe'?'bg-rose-100 text-rose-600':'text-gray-400'}`;
      document.getElementById('tab-matches-btn').className = `flex-1 py-2 text-xs font-bold rounded-lg ${tab==='matches'?'bg-rose-100 text-rose-600':'text-gray-400'}`;
      document.getElementById('tab-likes-btn').className = `flex-1 py-2 text-xs font-bold rounded-lg ${tab==='likes'?'bg-rose-100 text-rose-600':'text-gray-400'}`;
      render();
    }

    function handleSwipe(dir) {
      if (currentIndex >= NAMES.length) return;
      let curr = NAMES[currentIndex];
      
      if (!likes[currentUser]) likes[currentUser] = [];
      if (!dislikes[currentUser]) dislikes[currentUser] = [];

      if (dir === 'like') {
        if (!likes[currentUser].includes(curr.name)) {
          likes[currentUser].push(curr.name);
        }
        let other = currentUser === 'Alex' ? 'Marcelina' : 'Alex';
        if (likes[other] && likes[other].includes(curr.name)) {
          document.getElementById('match-name-text').innerText = `${curr.name} ${lastName}`;
          document.getElementById('match-modal').classList.remove('hidden');
        }
      } else {
        if (!dislikes[currentUser].includes(curr.name)) {
          dislikes[currentUser].push(curr.name);
        }
      }
      
      currentIndex++;
      syncToFirebase();
      render();
    }

    function closeModal() {
      document.getElementById('match-modal').classList.add('hidden');
    }

    function render() {
      let alexLikes = likes.Alex || [];
      let marcelinaLikes = likes.Marcelina || [];
      let matches = NAMES.filter(n => alexLikes.includes(n.name) && marcelinaLikes.includes(n.name));
      
      document.getElementById('match-count').innerText = matches.length;
      document.getElementById('like-count').innerText = (likes[currentUser] || []).length;
      document.getElementById('lastname-input').value = lastName;

      // Card
      if (currentIndex < NAMES.length) {
        let curr = NAMES[currentIndex];
        document.getElementById('name-display').innerText = curr.name;
        document.getElementById('surname-display').innerText = lastName;
        document.getElementById('origin-display').innerText = curr.origin;
        
        let tag = document.getElementById('gender-tag');
        tag.innerText = curr.gender === 'boy' ? 'Junge' : 'Mädchen';
        tag.className = `px-3 py-1 rounded-full text-xs font-bold mb-4 inline-block ${curr.gender==='boy'?'bg-blue-100 text-blue-600':'bg-pink-100 text-pink-600'}`;
      } else {
        document.getElementById('name-display').innerText = 'Alle durch!';
        document.getElementById('surname-display').innerText = '🎉';
      }

      // Matches List
      let mList = document.getElementById('matches-list');
      if (matches.length === 0) {
        mList.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs">Noch keine Matches. Swipt weiter!</div>`;
      } else {
        mList.innerHTML = matches.map(m => `
          <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-rose-100">
            <div>
              <span class="font-bold text-gray-800">${m.name} ${lastName}</span>
              <p class="text-[10px] text-gray-400">${m.origin}</p>
            </div>
            <span class="text-xl">🎉</span>
          </div>
        `).join('');
      }

      // Likes List
      document.getElementById('likes-title').innerText = `Deine Likes (${currentUser}):`;
      let lList = document.getElementById('likes-list');
      let myL = likes[currentUser] || [];
      if (myL.length === 0) {
        lList.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs">Du hast noch keine Namen geliked.</div>`;
      } else {
        lList.innerHTML = myL.map(n => `
          <div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center border border-rose-100">
            <span class="font-bold text-gray-800">${n} ${lastName}</span>
            <span class="text-xs text-rose-500 font-bold">♥ Geliked</span>
          </div>
        `).join('');
      }
    }

    render();
  </script>
</body>
</html>
