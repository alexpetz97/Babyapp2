<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex & Marcelina's Babyname</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const namesList = [
      { name: 'Liam', gender: 'boy', origin: 'Irisch / Deutsch', meaning: 'Entschlossener Beschützer' },
      { name: 'Emma', gender: 'girl', origin: 'Germanisch', meaning: 'Die Allumfassende' },
      { name: 'Noah', gender: 'boy', origin: 'Hebräisch', meaning: 'Der Ruhebringer' },
      { name: 'Mia', gender: 'girl', origin: 'Skandinavisch', meaning: 'Die Geliebte' },
      { name: 'Oliver', gender: 'boy', origin: 'Lateinisch', meaning: 'Der Olivenbaum-Pflanzer' },
      { name: 'Olivia', gender: 'girl', origin: 'Lateinisch', meaning: 'Die Olivenzweig-Trägerin' },
      { name: 'Mateo', gender: 'boy', origin: 'Spanisch', meaning: 'Gabe Gottes' },
      { name: 'Sophia', gender: 'girl', origin: 'Griechisch', meaning: 'Die göttliche Weisheit' },
      { name: 'Lucas', gender: 'boy', origin: 'Griechisch', meaning: 'Der Lichtbringer' },
      { name: 'Charlotte', gender: 'girl', origin: 'Französisch', meaning: 'Die Freie' },
      { name: 'Leo', gender: 'boy', origin: 'Lateinisch', meaning: 'Der Löwe' },
      { name: 'Ella', gender: 'girl', origin: 'Deutsch', meaning: 'Die Strahlende' }
    ];

    const NAMES = [];
    const prefixes = ['Al', 'El', 'Mar', 'San', 'Car', 'Cor', 'Mel', 'Nor', 'Ben', 'Finn'];
    const suffixes = ['son', 'ley', 'ton', 'lyn', 'ell', 'ian', 'er', 'en', 'ia', 'a'];
    for(let i=0; i<5200; i++) {
      let base = namesList[i % namesList.length];
      let genName = i < namesList.length ? base.name : prefixes[i % prefixes.length] + base.name.toLowerCase() + suffixes[i % suffixes.length];
      if(i >= namesList.length) genName = genName.charAt(0).toUpperCase() + genName.slice(1);
      NAMES.push({
        name: genName,
        gender: i % 2 === 0 ? 'boy' : 'girl',
        origin: 'Modern / Europäisch / Amerikanisch',
        meaning: base.meaning
      });
    }

    function App() {
      const [user, setUser] = useState('Alex');
      const [lastName, setLastName] = useState('Petz');
      const [index, setIndex] = useState(0);
      const [likes, setLikes] = useState({ Alex: [], Marcelina: [] });
      const [dislikes, setDislikes] = useState({ Alex: [], Marcelina: [] });
      const [tab, setTab] = useState('swipe');
      const [matchModal, setMatchModal] = useState(null);

      const current = NAMES[index];

      const handleSwipe = (dir) => {
        if (!current) return;
        const name = current.name;

        if (dir === 'like') {
          const updatedLikes = { ...likes, [user]: [...likes[user], name] };
          setLikes(updatedLikes);

          const otherUser = user === 'Alex' ? 'Marcelina' : 'Alex';
          if (updatedLikes[otherUser].includes(name)) {
            setMatchModal(name);
          }
        } else {
          setDislikes({ ...dislikes, [user]: [...dislikes[user], name] });
        }
        setIndex(prev => prev + 1);
      };

      const matches = NAMES.filter(n => likes.Alex.includes(n.name) && likes.Marcelina.includes(n.name));
      const myLikes = likes[user];

      return (
        <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col">
          {/* Header */}
          <div className="bg-white rounded-2xl p-4 shadow-sm mb-4 flex justify-between items-center">
            <div>
              <h1 className="font-bold text-rose-500">Alex & Marcelina</h1>
              <p className="text-[10px] text-gray-400">{NAMES.length} Namen</p>
            </div>
            <div className="flex bg-rose-50 p-1 rounded-xl">
              <button onClick={() => setUser('Alex')} className={`px-3 py-1 rounded-lg text-xs font-bold ${user === 'Alex' ? 'bg-rose-500 text-white' : 'text-gray-500'}`}>Alex</button>
              <button onClick={() => setUser('Marcelina')} className={`px-3 py-1 rounded-lg text-xs font-bold ${user === 'Marcelina' ? 'bg-purple-500 text-white' : 'text-gray-500'}`}>Marcelina</button>
            </div>
          </div>

          {/* Nachname */}
          <div className="bg-white rounded-xl p-3 shadow-sm mb-4">
            <label className="text-xs text-gray-400 font-semibold block mb-1">Euer Nachname (Vorschau):</label>
            <input type="text" value={lastName} onChange={e => setLastName(e.target.value)} className="w-full bg-rose-50 rounded-lg p-2 text-sm font-bold outline-none" />
          </div>

          {/* Tabs */}
          <div className="flex bg-white rounded-xl p-1 shadow-sm mb-4">
            <button onClick={() => setTab('swipe')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${tab === 'swipe' ? 'bg-rose-100 text-rose-600' : 'text-gray-400'}`}>Swipen</button>
            <button onClick={() => setTab('matches')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${tab === 'matches' ? 'bg-rose-100 text-rose-600' : 'text-gray-400'}`}>Matches ({matches.length})</button>
            <button onClick={() => setTab('likes')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${tab === 'likes' ? 'bg-rose-100 text-rose-600' : 'text-gray-400'}`}>Likes ({myLikes.length})</button>
          </div>

          {/* Swipe Ansicht */}
          {tab === 'swipe' && (
            <div className="flex-1 flex flex-col justify-center items-center">
              {current ? (
                <div className="w-full bg-white rounded-3xl p-8 shadow-md text-center">
                  <span className={`px-3 py-1 rounded-full text-xs font-bold mb-4 inline-block ${current.gender === 'boy' ? 'bg-blue-100 text-blue-600' : 'bg-pink-100 text-pink-600'}`}>
                    {current.gender === 'boy' ? 'Junge' : 'Mädchen'}
                  </span>
                  <h2 className="text-4xl font-extrabold text-gray-800">{current.name}</h2>
                  <p className="text-2xl font-bold text-rose-400 mt-1">{lastName}</p>
                  <p className="text-xs text-gray-500 mt-4">{current.origin}</p>
                  <div className="flex justify-center gap-6 mt-8">
                    <button onClick={() => handleSwipe('dislike')} className="w-16 h-16 rounded-full bg-gray-100 text-gray-400 text-2xl font-bold">✕</button>
                    <button onClick={() => handleSwipe('like')} className="w-16 h-16 rounded-full bg-rose-500 text-white text-2xl font-bold">♥</button>
                  </div>
                </div>
              ) : (
                <div className="bg-white rounded-2xl p-6 text-center shadow-sm w-full">
                  <p className="font-bold text-gray-700">Alle Namen durchgesehen! 🎉</p>
                  <button onClick={() => setIndex(0)} className="mt-4 px-4 py-2 bg-rose-500 text-white rounded-xl text-xs font-bold">Von vorne</button>
                </div>
              )}
            </div>
          )}

          {/* Matches Ansicht */}
          {tab === 'matches' && (
            <div className="space-y-2">
              <h3 className="font-bold text-sm text-gray-700 px-1">Gemeinsame Favoriten (Matches ❤️):</h3>
              {matches.length === 0 ? (
                <div className="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs">Noch keine Matches. Swipt weiter!</div>
              ) : (
                matches.map((m, i) => (
                  <div key={i} className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center">
                    <div>
                      <span className="font-bold text-gray-800">{m.name} {lastName}</span>
                      <p className="text-[10px] text-gray-400">{m.origin}</p>
                    </div>
                    <span className="text-xl">🎉</span>
                  </div>
                ))
              )}
            </div>
          )}

          {/* Likes Ansicht */}
          {tab === 'likes' && (
            <div className="space-y-2">
              <h3 className="font-bold text-sm text-gray-700 px-1">Deine Likes ({user}):</h3>
              {myLikes.length === 0 ? (
                <div className="bg-white p-6 rounded-2xl text-center text-gray-400 text-xs">Du hast noch keine Namen geliked.</div>
              ) : (
                myLikes.map((name, i) => (
                  <div key={i} className="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center">
                    <span className="font-bold text-gray-800">{name} {lastName}</span>
                    <span className="text-xs text-rose-500 font-bold">♥ Geliked</span>
                  </div>
                ))
              )}
            </div>
          )}

          {/* Match Popup Modal */}
          {matchModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl border-4 border-rose-300">
                <div className="text-4xl mb-2">💖</div>
                <h2 className="text-2xl font-bold text-rose-500">MATCH!</h2>
                <p className="text-sm text-gray-600 mt-1">Ihr beide findet gut:</p>
                <p className="text-xl font-black text-gray-800 mt-1">{matchModal} {lastName}</p>
                <button onClick={() => setMatchModal(null)} className="mt-6 w-full py-3 bg-rose-500 text-white font-bold rounded-2xl shadow-lg">Super!</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
